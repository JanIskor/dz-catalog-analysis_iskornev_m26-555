[project]
name = "dz-catalog-analysis-iskornev-m26-555"
version = "0.1.0"
description = "Анализ каталога фильмов"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
